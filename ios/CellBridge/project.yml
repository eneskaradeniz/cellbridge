name: CellBridge
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  CellBridge:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CellBridge
        CFBundleLocalizations: [en, tr]
        NSBonjourServices: [_cellbridge._tcp]
        NSCameraUsageDescription: Scans the QR code on the phone to pair with it once.
        NSFaceIDUsageDescription: Keeps the pairing details hidden until you unlock them.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: cellbridge
            CFBundleURLSchemes: [cellbridge]
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSLocalNetworkUsageDescription: Talks to the CellBridge host on the local network.
        NSContactsUsageDescription: Shows who is calling or texting and lets you pick a number from your contacts. Contacts stay on this phone.
        NSMicrophoneUsageDescription: Sends your voice to the call on the phone you are bridging.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  CellBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources: [Tests]
    dependencies:
      - target: CellBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  CellBridge:
    build:
      targets:
        CellBridge: all
        CellBridgeTests: [test]
    test:
      language: en
      region: US
      targets: [CellBridgeTests]
