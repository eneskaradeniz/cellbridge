name: CellBridge
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  CellBridge:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Sources
        excludes: [Live, Notify]
    entitlements:
      path: Sources/CellBridge.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).cellbridge.shared"]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CellBridge
        CFBundleLocalizations: [en, tr]
        NSBonjourServices: [_cellbridge._tcp]
        NSCameraUsageDescription: Scans the QR code on the phone to pair with it once.
        NSFaceIDUsageDescription: Keeps the pairing details hidden until you unlock them.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: cellbridge
            CFBundleURLSchemes: [cellbridge]
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSSupportsLiveActivities: true
        CBKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).cellbridge.shared
        NSLocalNetworkUsageDescription: Talks to the CellBridge host on the local network.
        NSContactsUsageDescription: Shows who is calling or texting and lets you pick a number from your contacts. Contacts stay on this phone.
        NSMicrophoneUsageDescription: Sends your voice to the call on the phone you are bridging.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: CellBridgeLive
        embed: true
      - target: CellBridgeNotify
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge
        CODE_SIGN_STYLE: $(SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(PROFILE_SPECIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  CellBridgeLive:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources: [Sources/Live, Sources/Shared]
    info:
      path: Sources/Live/Info.plist
      properties:
        CFBundleDisplayName: CellBridge Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge.live
        CODE_SIGN_STYLE: $(SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(LIVE_PROFILE_SPECIFIER)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  CellBridgeNotify:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources: [Sources/Notify, Sources/Shared]
    entitlements:
      path: Sources/Notify/Notify.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).cellbridge.shared"]
    info:
      path: Sources/Notify/Info.plist
      properties:
        CFBundleDisplayName: CellBridge Notify
        CBKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).cellbridge.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge.notify
        CODE_SIGN_STYLE: $(SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(NOTIFY_PROFILE_SPECIFIER)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  CellBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources: [Tests]
    dependencies:
      - target: CellBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  CellBridge:
    build:
      targets:
        CellBridge: all
        CellBridgeTests: [test]
    test:
      language: en
      region: US
      targets: [CellBridgeTests]
