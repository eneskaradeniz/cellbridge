name: CellBridge
options:
  bundleIdPrefix: com.example
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  CellBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CellBridge
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSLocalNetworkUsageDescription: Talks to the CellBridge host on the local network.
        NSContactsUsageDescription: Shows who is calling or texting and lets you pick a number from your contacts. Contacts stay on this phone.
        NSMicrophoneUsageDescription: Sends your voice to the call on the phone you are bridging.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
  CellBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: CellBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cellbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  CellBridge:
    build:
      targets:
        CellBridge: all
        CellBridgeTests: [test]
    test:
      targets: [CellBridgeTests]
